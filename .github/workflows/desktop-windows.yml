name: desktop-windows

# Builds the Windows desktop bundle (varyaone.exe + varyaone-client.exe +
# embedded SPA + bundled PostgreSQL), the updater zip, and the Inno Setup install
# wizard; on a tag it attaches all three (+ sha256) plus latest.json — the
# release catalog document the updater polls (internal/update/catalog.go) — to
# the GitHub Release, publishing it only once every asset is uploaded (a
# reader must never see a half-populated release). latest.json is also copied
# to release/latest.json on main as a fallback source — see
# deploy/windows/README.md. varya-pulse no longer serves a release catalog
# (Cloudflare Worker, ../varya-pulse); it only collects anonymous usage/install
# telemetry and feedback now.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version string (e.g. v0.3.0-rc1)"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-2025
    # A hang in the bundled stack must fail the run, not sit on a runner for
    # hours. The bundle build itself is ~15 min including the PostgreSQL fetch.
    timeout-minutes: 45
    env:
      BUNDLED_PG_VERSION: 18.4-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve version
        id: v
        shell: bash
        # On a tag push github.ref_name is the tag; on manual dispatch it is the
        # branch, so prefer the explicit input there.
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Cache Windows runtime bundle
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            deploy/windows/pgsql
            deploy/windows/vc_redist.x64.exe
            deploy/windows/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          key: windows-runtime-x64-pg${{ env.BUNDLED_PG_VERSION }}-${{ hashFiles('deploy/windows/fetch-tools.ps1') }}

      - name: Fetch bundled PostgreSQL
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./deploy/windows/fetch-tools.ps1 -PgVersion $env:BUNDLED_PG_VERSION

      - name: Locate packaging tools
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" |
              Select-Object -First 1
          }
          Split-Path $iscc.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($sevenZip) { $sevenZipPath = $sevenZip.Source }
          else { $sevenZipPath = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZipPath)) { throw "The runner's preinstalled 7z.exe was not found" }
          Split-Path $sevenZipPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install go-winres (refresh client exe icon)
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          echo "$(go env GOPATH)\bin" >> "$env:GITHUB_PATH"

      - name: Build bundle
        shell: bash
        env:
          VARYAONE_REQUIRE_INSTALLER: "1"
        run: deploy/windows/build-bundle.sh "${{ steps.v.outputs.version }}"

      - name: Smoke-test the packaged Windows stack
        shell: pwsh
        run: |
          $stage = Resolve-Path "dist/windows/VaryaOne"
          $smokeHome = Join-Path $env:RUNNER_TEMP "varyaone-stack-smoke"
          if (Test-Path $smokeHome) { Remove-Item -Recurse -Force $smokeHome }
          New-Item -ItemType Directory -Path $smokeHome | Out-Null
          $env:VARYAONE_DESKTOP_HOME = $smokeHome
          $env:VARYAONE_HTTP_PORT = "18080"
          $stdout = Join-Path $env:RUNNER_TEMP "varyaone-stack-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "varyaone-stack-stderr.log"
          $process = $null
          try {
            $process = Start-Process (Join-Path $stage "varyaone.exe") `
              -ArgumentList "stack" -WindowStyle Hidden -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            # initdb plus the squashed baseline migration on a cold runner disk;
            # sized like the real first boot, not like a warm restart.
            $deadline = (Get-Date).AddMinutes(5)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "packaged stack exited before readiness (code $($process.ExitCode))"
              }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:18080/health/ready" -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.service -eq "api") {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "packaged stack did not become ready within five minutes" }
          } catch {
            # A stack that hangs before it logs anything is undiagnosable, so dump
            # every stream it could have written to, each clearly labelled.
            foreach ($log in @(
              (Join-Path $smokeHome "logs/stack.log"),
              (Join-Path $smokeHome "logs/postgres.log"),
              (Join-Path $smokeHome "logs/pg_ctl.log"),
              $stdout, $stderr
            )) {
              Write-Host "----- $log -----"
              if (Test-Path $log) { Get-Content $log -Tail 200 } else { Write-Host "(missing)" }
            }
            throw
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            $pgData = Join-Path $smokeHome "pgdata"
            $pgCtl = Join-Path $stage "pgsql/bin/pg_ctl.exe"
            if ((Test-Path (Join-Path $pgData "PG_VERSION")) -and (Test-Path $pgCtl)) {
              & $pgCtl stop -w -m fast "--pgdata=$pgData"
            }
            # Stop-Process kills only the stack; a postmaster that pg_ctl could
            # not reach would still hold its port when the installer test runs.
            Get-Process postgres -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -and $_.Path.StartsWith($stage) } |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke-test installer and Windows service lifecycle
        shell: pwsh
        run: |
          $version = "${{ steps.v.outputs.version }}".TrimStart("v")
          $setup = Resolve-Path "dist/windows/VaryaOne-Setup-$version.exe"
          $setupLog = Join-Path $env:RUNNER_TEMP "varyaone-setup.log"
          $installDir = Join-Path $env:ProgramFiles "VaryaOne"
          $serverExe = Join-Path $installDir "varyaone.exe"
          $uninstaller = Join-Path $installDir "unins000.exe"
          $serviceHome = Join-Path $env:ProgramData "VaryaOne"
          try {
            $installed = Start-Process $setup -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
              "/TASKS=lanaccess", "/LOG=$setupLog"
            )
            if ($installed.ExitCode -ne 0) {
              throw "installer exited with code $($installed.ExitCode)"
            }
            if (-not (Test-Path $serverExe)) { throw "installed server executable is missing" }
            & $serverExe service wait-ready
            if ($LASTEXITCODE -ne 0) { throw "installed service did not become ready" }
            $service = Get-Service -Name VaryaOne -ErrorAction Stop
            if ($service.Status -ne "Running") {
              throw "SCM reports VaryaOne as $($service.Status)"
            }

            # Every reboot and every update goes through a stop/start cycle, so
            # a stack that only survives its first boot is not shippable. This
            # also exercises the bundled cluster's shutdown and restart.
            & $serverExe service restart
            if ($LASTEXITCODE -ne 0) { throw "service restart failed" }
            & $serverExe service wait-ready
            if ($LASTEXITCODE -ne 0) { throw "service did not become ready after restart" }
            $service = Get-Service -Name VaryaOne -ErrorAction Stop
            if ($service.Status -ne "Running") {
              throw "after restart SCM reports VaryaOne as $($service.Status)"
            }
          } catch {
            if (Test-Path $setupLog) { Get-Content $setupLog -Tail 200 }
            foreach ($log in @(
              (Join-Path $serviceHome "logs/stack.log"),
              (Join-Path $serviceHome "logs/postgres.log"),
              (Join-Path $serviceHome "logs/pg_ctl.log")
            )) {
              Write-Host "----- $log -----"
              if (Test-Path $log) { Get-Content $log -Tail 200 } else { Write-Host "(missing)" }
            }
            throw
          } finally {
            if (Test-Path $uninstaller) {
              Start-Process $uninstaller -Wait -ArgumentList @(
                "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
              )
            } elseif (Test-Path $serverExe) {
              & $serverExe service stop
              & $serverExe service uninstall
            }
            if (Test-Path $serviceHome) { Remove-Item -Recurse -Force $serviceHome }
          }

      - name: Verify release artifacts
        shell: bash
        run: |
          version="${{ steps.v.outputs.version }}"
          test -s "dist/windows/varyaone-${version}-windows-amd64.zip"
          test -s "dist/windows/varyaone-${version}-windows-amd64.zip.sha256"
          test -s "dist/windows/VaryaOne-Setup-${version#v}.exe"
          archive="dist/windows/varyaone-${version}-windows-amd64.zip"
          7z t "$archive"
          entries="$(7z l -ba "$archive" | awk '{print $NF}' | tr '\\' '/')"
          for entry in varyaone.exe varyaone-client.exe RELEASE pgsql/bin/initdb.exe pgsql/bin/pg_ctl.exe pgsql/bin/pg_dump.exe pgsql/bin/pg_restore.exe; do
            grep -Fx "$entry" <<<"$entries"
          done

      - name: Generate release catalog (latest.json)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          repo="${{ github.repository }}"
          artifact_prefix="https://github.com/${repo}/releases/download"
          sha256="$(cut -d' ' -f1 "dist/windows/varyaone-${version}-windows-amd64.zip.sha256")"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The tag's own annotation (if any) becomes the release notes; a
          # lightweight tag (workflow_dispatch dry-runs, or a plain `git tag`)
          # yields an empty message, which is a valid (if terse) notes_md.
          notes_md="$(git for-each-ref "refs/tags/${version}" --format='%(contents)' 2>/dev/null || true)"

          # Carry the previous release's channel entry into history (capped at
          # 10) so fetchNotes can still find its notes right after an apply.
          # Best-effort: a missing/unreadable previous catalog just means an
          # empty starting history, never a failed build.
          prev_history="[]"
          if prev_b64="$(gh api "repos/${repo}/contents/release/latest.json?ref=main" -q .content 2>/dev/null)"; then
            prev_history="$(echo "$prev_b64" | base64 -d 2>/dev/null | \
              jq -c '([.channels.stable] + (.history // [])) | unique_by(.version) | .[:10]' 2>/dev/null || echo '[]')"
          fi

          jq -n \
            --arg version "$version" \
            --arg notes_md "$notes_md" \
            --arg published_at "$published_at" \
            --arg artifact_url "${artifact_prefix}/${version}/varyaone-${version}-windows-amd64.zip" \
            --arg sha256 "$sha256" \
            --argjson history "$prev_history" \
            --slurpfile channel release/channel.json \
            '{
              schema_version: 1,
              channels: {
                stable: ($channel[0] + {
                  version: $version,
                  notes_md: $notes_md,
                  published_at: $published_at,
                  windows_artifact_url: $artifact_url,
                  windows_sha256: $sha256
                })
              },
              yanked: [],
              history: ($history | map(select(.version != $version)))
            }' > dist/windows/latest.json

          # A malformed catalog must never ship: fail the job rather than
          # publish a release the updater can't parse or would reject the
          # artifact of (see internal/update/catalog.go toLatestInfo).
          jq -e '
            .schema_version == 1
            and (.channels.stable.version | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+"))
            and (.channels.stable.windows_sha256 | test("^[0-9a-f]{64}$"))
            and (.channels.stable.windows_artifact_url | startswith("'"$artifact_prefix"'/"))
          ' dist/windows/latest.json > /dev/null

          cat dist/windows/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: varyaone-windows-${{ steps.v.outputs.version }}
          path: |
            dist/windows/*.zip*
            dist/windows/*.exe
            dist/windows/latest.json

      - name: Attach to release (draft)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/windows/*.zip
            dist/windows/*.zip.sha256
            dist/windows/*.exe
            dist/windows/latest.json

      - name: Publish release
        # Every asset (zip, sha256, setup.exe, latest.json) is uploaded before
        # the release goes public, so a client polling latest.json — or a
        # human downloading the zip — never sees a half-populated release.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" --draft=false

      - name: Commit release catalog fallback copy
        # release/latest.json on main is the secondary source
        # (VARYAONE_UPDATE_CATALOG_URL default #2) for networks where the
        # release CDN itself is unreachable. Written through the Contents API
        # (not git push) because this job checks out the tag, not main —
        # pushing the checked-out HEAD would rewrite main to the tag's commit
        # instead of adding a file to it.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          existing_sha="$(gh api "repos/${repo}/contents/release/latest.json?ref=main" -q .sha 2>/dev/null || true)"
          sha_args=()
          if [ -n "$existing_sha" ]; then
            sha_args=(-f "sha=${existing_sha}")
          fi
          gh api --method PUT "repos/${repo}/contents/release/latest.json" \
            -f "message=release: publish ${{ steps.v.outputs.version }} catalog" \
            -f "content=$(base64 -w0 dist/windows/latest.json)" \
            -f "branch=main" \
            "${sha_args[@]}"
