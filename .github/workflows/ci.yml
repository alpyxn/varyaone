name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pin the verified multi-architecture image. The 18.4-alpine tag is
        # mutable, and migrations require the bundled btree_gist extension.
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: varyaone_test
          POSTGRES_USER: varyaone
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U varyaone -d varyaone_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VARYAONE_DATABASE_URL: postgres://varyaone:test-only-password@localhost:5432/varyaone_test?sslmode=disable
      VARYAONE_TEST_DATABASE_URL: postgres://varyaone:test-only-password@localhost:5432/varyaone_test?sslmode=disable
      # config.Load() always requires a key; migrate/status never decrypt with it.
      # 32 zero bytes, base64 — matches the config package's own test fixtures.
      VARYAONE_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - name: PostgreSQL 18 client (backup engine tests shell out to pg_dump)
        run: |
          sudo sh -c 'echo "deb [arch=amd64] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Prepare integration database extensions
        run: |
          # Extensions are database-wide. Install btree_gist once in public so
          # isolated test-schema cleanup can never remove it underneath a
          # migration running in another package.
          psql "$VARYAONE_TEST_DATABASE_URL" --set ON_ERROR_STOP=1 \
            --command 'CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public'
          test "$(psql "$VARYAONE_TEST_DATABASE_URL" --tuples-only --no-align \
            --command "SELECT n.nspname FROM pg_extension e JOIN pg_namespace n ON n.oid=e.extnamespace WHERE e.extname='btree_gist'")" = public
      - name: Tests (unit packages parallel, database packages serial)
        shell: bash
        run: |
          # Only packages whose tests use the shared PostgreSQL service need
          # -p 1; serialising every pure unit package made the whole suite wait.
          # Use git grep: it is guaranteed on an actions/checkout runner, while
          # ripgrep is not part of GitHub's runner contract. An empty result is
          # a hard failure, otherwise DB tests would silently join the parallel
          # unit batch and exhaust PostgreSQL's shared lock table.
          db_test_files_text="$(
            git grep -l 'VARYAONE_TEST_DATABASE_URL' -- cmd internal |
              awk '/_test\.go$/'
          )"
          mapfile -t db_test_files <<< "$db_test_files_text"
          ((${#db_test_files[@]} > 0)) || {
            echo "database-backed test package detection returned no files" >&2
            exit 1
          }
          db_packages_text="$(
            printf '%s\n' "${db_test_files[@]}" |
              xargs -r -n1 dirname | sort -u |
              sed "s#^#$(go list -m)/#"
          )"
          mapfile -t db_packages <<< "$db_packages_text"
          all_packages_text="$(go list ./... | sort -u)"
          mapfile -t all_packages <<< "$all_packages_text"
          unit_packages_text="$(
            comm -23 \
              <(printf '%s\n' "${all_packages[@]}") \
              <(printf '%s\n' "${db_packages[@]}")
          )"
          mapfile -t unit_packages <<< "$unit_packages_text"
          ((${#all_packages[@]} == ${#unit_packages[@]} + ${#db_packages[@]})) || {
            echo "Go package partition is incomplete or overlapping" >&2
            exit 1
          }
          # Never pass an empty/root filesystem path to `go test`; package
          # import paths remain stable across local and GitHub runner layouts.
          module_path="$(go list -m)"
          for package in "${unit_packages[@]}" "${db_packages[@]}"; do
            [[ "$package" == "$module_path" || "$package" == "$module_path/"* ]] || {
              echo "refusing invalid Go package argument: '$package'" >&2
              exit 1
            }
          done
          go test -race "${unit_packages[@]}"
          # Integration packages each migrate an isolated schema, but their
          # catalog work is intentionally serial to avoid PostgreSQL OID races.
          go test -race -p 1 "${db_packages[@]}"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - name: Verify pending migration is reported
        run: if go run ./cmd/varyaone migrate status; then exit 1; fi
      - run: go run ./cmd/varyaone migrate up
      - run: go run ./cmd/varyaone migrate status
      - run: go generate ./...
      - run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.30.0 generate
      - run: git diff --exit-code

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: ./Dockerfile.backend
          - image: frontend
            context: ./web
            dockerfile: ./web/Dockerfile
    env:
      POSTGRES_PASSWORD: ci-only-password
      VARYAONE_MASTER_KEY: ci-only-master-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=containers-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=containers-${{ matrix.image }}
