<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Varya Kontrol Paneli</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px; font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    background: #f4f4f5; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1b1d; color: #ececec; }
    .card { background: #232326; }
    .pill { background: #2a2a2d; }
  }
  h1 { font-size: 17px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  h1 svg { width: 26px; height: 26px; display: block; flex: none; }
  h1 b { color: #c1272d; }
  .sub { opacity: .65; font-size: 12px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
          box-shadow: 0 3px 12px rgba(0,0,0,.08); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .k { font-weight: 600; }
  .pill { background: #eee; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .ok { color: #1a7f37; } .bad { color: #c1272d; }
  .urls { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
  label.opt { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; cursor: pointer; }
  label.opt small { display: block; opacity: .65; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    padding: 8px 12px; border: 0; border-radius: 8px; background: #c1272d; color: #fff;
    min-height: 44px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: inherit; border: 1px solid #999; }
  button:disabled, input:disabled { cursor: wait; opacity: .55; }
  button:focus-visible, input:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  .status { min-height: 18px; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>
    <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Varya One">
      <g fill="#C1272D">
        <rect x="20" y="100" width="30" height="90" rx="3" transform="rotate(-26 35 190)"/>
        <rect x="70" y="55" width="30" height="135" rx="3" transform="rotate(-12 85 190)"/>
        <rect x="120" y="35" width="30" height="155" rx="3" transform="rotate(-4 135 190)"/>
      </g>
      <rect x="170" y="10" width="30" height="180" rx="3" fill="currentColor"/>
    </svg>
    <span>Varya <b>Kontrol Paneli</b></span>
  </h1>
  <div class="sub" id="ver"></div>

  <div class="card">
    <div class="row"><span class="k">Servis</span><span id="svc" class="pill">—</span></div>
    <ul class="urls" id="urls"></ul>
    <div class="actions" style="margin-top:10px">
      <button id="restart">Servisi yönet</button>
      <button class="ghost" id="stop">Servisi durdur</button>
      <button class="ghost" id="repair">Servisi onar</button>
      <button class="ghost" id="logs">Loglar</button>
    </div>
  </div>

  <div class="card">
    <div class="k">Ağ modu</div>
    <label class="opt"><input type="radio" name="mode" value="local">
      <span>Yalnızca bu bilgisayar<small>Sunucu 127.0.0.1'i dinler, güvenlik duvarı kuralı ve ağ yayını kapalı.</small></span></label>
    <label class="opt"><input type="radio" name="mode" value="lan">
      <span>Ağa açık<small>Ağdaki diğer bilgisayarlar erişebilir; 8080 güvenlik duvarı kuralı ve mDNS yayını açık.</small></span></label>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const panelToken = "__VARYA_PANEL_TOKEN__";
  let lastState = null;
  let busy = false;
  let refreshInFlight = false;

  function errorText(error) {
    return String(error && error.message || error || "Bilinmeyen hata");
  }

  function setBusy(value) {
    busy = value;
    document.body.setAttribute("aria-busy", String(value));
    document.querySelectorAll("button, input[name=mode]").forEach(control => {
      control.disabled = value;
    });
  }

  async function refresh() {
    if (refreshInFlight) return;
    refreshInFlight = true;
    let s;
    try { s = await window.hostPanelState(panelToken); }
    catch (e) {
      if (!busy) $("status").textContent = errorText(e);
      refreshInFlight = false;
      return;
    }
    lastState = s;
    $("ver").textContent = "Sürüm " + (s.version || "?");
    const svc = $("svc");
    if (s.serviceError) { svc.textContent = "durum okunamadı"; svc.className = "pill bad"; }
    else if (!s.serviceInstalled) { svc.textContent = "kurulu değil"; svc.className = "pill bad"; }
    else if (s.serving) { svc.textContent = "çalışıyor"; svc.className = "pill ok"; }
    else if (s.running) { svc.textContent = "başlatılıyor / henüz hazır değil"; svc.className = "pill bad"; }
    else if (s.serviceStatus === "stop_pending") { svc.textContent = "durduruluyor"; svc.className = "pill bad"; }
    else { svc.textContent = "durdu"; svc.className = "pill bad"; }
    $("restart").textContent = !s.serviceInstalled ? "Servisi kur ve başlat" :
      (!s.running ? "Servisi başlat" : "Servisi yeniden başlat");

    $("stop").disabled = busy || !s.serviceInstalled || !s.running;

    // Addresses are informational: the panel manages the service, it does not
    // open the application.
    const ul = $("urls"); ul.innerHTML = "";
    (s.urls || []).forEach(u => {
      const li = document.createElement("li");
      li.textContent = u;
      ul.appendChild(li);
    });
    document.querySelectorAll('input[name=mode]').forEach(r => { r.checked = (r.value === s.mode); });
    if (!busy && s.serviceError) $("status").textContent = "Windows servis hatası: " + s.serviceError;
    refreshInFlight = false;
  }

  $("stop").addEventListener("click", async () => {
    $("status").textContent = "Servis durduruluyor… (yönetici onayı gerekebilir)";
    setBusy(true);
    try {
      await window.hostStop(panelToken);
      $("status").textContent = "Servis durduruldu.";
    } catch (e) { $("status").textContent = errorText(e); }
    finally { setBusy(false); await refresh(); }
  });
  $("restart").addEventListener("click", async () => {
    const verb = lastState && !lastState.serviceInstalled ? "Kurulup başlatılıyor" :
      (lastState && !lastState.running ? "Başlatılıyor" : "Yeniden başlatılıyor");
    $("status").textContent = verb + "… (yönetici onayı gerekebilir)";
    setBusy(true);
    try {
      await window.hostRestart(panelToken);
      $("status").textContent = "Varya One çalışıyor ve kullanıma hazır.";
    } catch (e) { $("status").textContent = errorText(e); }
    finally { setBusy(false); await refresh(); }
  });
  $("logs").addEventListener("click", () => window.hostOpenLogs(panelToken).catch(e => {
    $("status").textContent = errorText(e);
  }));
  $("repair").addEventListener("click", async () => {
    $("status").textContent = "Servis kaydı onarılıyor… (yönetici onayı gerekir)";
    setBusy(true);
    try {
      await window.hostRepair(panelToken);
      $("status").textContent = "Servis kaydı onarıldı; Varya One kullanıma hazır.";
    } catch (e) { $("status").textContent = errorText(e); }
    finally { setBusy(false); await refresh(); }
  });

  document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener("change", async () => {
    $("status").textContent = "Ağ modu değiştiriliyor… (yönetici onayı gerekebilir)";
    setBusy(true);
    try { await window.hostApplyMode(panelToken, r.value); $("status").textContent = "Ağ modu uygulandı; sunucu hazır."; }
    catch (e) { $("status").textContent = errorText(e); }
    finally { setBusy(false); await refresh(); }
  }));

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
