<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Varya One</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    background: #f4f4f5; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1b1d; color: #ececec; }
    input { background: #2a2a2d; color: #ececec; border-color: #444; }
    .card { background: #232326; }
  }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .brand svg { width: 40px; height: 40px; display: block; }
  .brand b { color: #c1272d; }
  .brand span { font-weight: 400; }
  .card {
    background: #fff; border-radius: 12px; padding: 22px; width: 420px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12); display: flex; flex-direction: column; gap: 12px;
  }
  label { font-weight: 600; font-size: 13px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc;
    font-size: 14px;
  }
  button {
    padding: 10px 14px; border: 0; border-radius: 8px; background: #c1272d; color: #fff;
    min-height: 44px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  .hint { font-size: 12px; opacity: .7; }
  .status { min-height: 18px; font-size: 13px; }
  .status.err { color: #c1272d; }
  .found { font-size: 12px; }
  .found a { display: inline-block; min-height: 24px; padding: 2px; color: #c1272d; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Varya One">
      <g fill="#C1272D">
        <rect x="20" y="100" width="30" height="90" rx="3" transform="rotate(-26 35 190)"/>
        <rect x="70" y="55" width="30" height="135" rx="3" transform="rotate(-12 85 190)"/>
        <rect x="120" y="35" width="30" height="155" rx="3" transform="rotate(-4 135 190)"/>
      </g>
      <rect x="170" y="10" width="30" height="180" rx="3" fill="currentColor"/>
    </svg>
    <div><b>Varya</b> <span>One</span></div>
  </div>
  <div class="card">
    <label for="addr">Sunucu adresi</label>
    <input id="addr" list="history" placeholder="http://192.168.1.10:8080" autocomplete="off">
    <datalist id="history"></datalist>
    <div class="found" id="found"></div>
    <button id="go">Bağlan</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="hint">Aynı ağdaki bir sunucu otomatik bulunursa adres hazır gelir.</div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const clientToken = "__VARYA_CLIENT_TOKEN__";
  const addr = $("addr"), status = $("status"), goBtn = $("go");

  function setStatus(msg, isErr) {
    status.textContent = msg || "";
    status.className = "status" + (isErr ? " err" : "");
  }

  async function connect() {
    const url = addr.value.trim();
    if (!url) { setStatus("Bir adres girin.", true); return; }
    goBtn.disabled = true;
    setStatus("Bağlanılıyor…");
    try {
      await window.hostConnect(clientToken, url);
      // On success the host navigates this window away.
    } catch (e) {
      setStatus(String(e && e.message || e), true);
      goBtn.disabled = false;
    }
  }

  goBtn.addEventListener("click", connect);
  addr.addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });

  (async function init() {
    let saved = { lastURL: "", history: [] };
    try { saved = await window.hostSaved(clientToken); } catch (e) {}
    const dl = $("history");
    (saved.history || []).forEach(u => {
      const o = document.createElement("option"); o.value = u; dl.appendChild(o);
    });

    let discovered = [];
    try { discovered = await window.hostDiscover(clientToken); } catch (e) {}
    if (discovered.length) {
      addr.value = discovered[0].url;
      const box = $("found");
      box.textContent = "Bulundu: ";
      discovered.forEach((server, index) => {
        if (index) box.append(document.createTextNode(" · "));
        const link = document.createElement("a");
        link.href = "#";
        link.textContent = server.name || server.url;
        link.addEventListener("click", (event) => {
          event.preventDefault();
          addr.value = server.url;
          connect();
        });
        box.append(link);
      });
    } else if (saved.lastURL) {
      addr.value = saved.lastURL;
    } else {
      addr.value = "http://localhost:8080";
      // A clean Windows installation includes its own local server. Open it
      // immediately when ready; if first-run initialization is still ongoing,
      // leave the address visible so the user can retry without losing context.
      setStatus("Yerel sunucuya bağlanılıyor…");
      try { await window.hostConnect(clientToken, addr.value); return; }
      catch (e) { setStatus("Yerel sunucu henüz hazır değil; tekrar deneyin.", true); }
    }
    addr.focus();
  })();
</script>
</body>
</html>
