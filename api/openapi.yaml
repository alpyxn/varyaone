      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeAdvanceReasonInput" } } } }
      responses: { "201": { description: Advance after reversal }, "409": { description: Already reversed or dependent transaction exists } }
