  # HR and payroll handlers use the existing session/CSRF middleware. Money and
  # rate properties in their concrete payloads are JSON strings; dates are
  # YYYY-MM-DD and timestamps are UTC RFC3339 values.
  /api/v1/hr/employee-advances:
    get:
      operationId: listEmployeeAdvances
      summary: Filter and list employee advances with total outstanding balance
      x-varya-permission: hr.employee_advance.read
      parameters:
        - { name: employee_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED, WRITTEN_OFF, REVERSED] } }
        - { name: balance, in: query, schema: { type: string, enum: [OPEN, CLOSED] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string } }
      responses: { "200": { description: Employee advance page } }
    post:
      operationId: createEmployeeAdvance
      summary: Atomically post a TRY employee advance and cash/bank OUT movement
      x-varya-permission: hr.employee_advance.post
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeAdvanceCreateInput" } } } }
      responses: { "201": { description: Posted employee advance, content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeAdvance" } } } }, "409": { description: Idempotency or finance policy conflict } }
  /api/v1/hr/employee-advances/{advanceID}:
    parameters: [{ name: advanceID, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { operationId: getEmployeeAdvance, summary: Read advance summary and chronological immutable ledger, x-varya-permission: hr.employee_advance.read, responses: { "200": { description: Employee advance, content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeAdvance" } } } } } }
  /api/v1/hr/employees/{employeeID}/advances:
    parameters: [{ name: employeeID, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { operationId: listEmployeeAdvancesByEmployee, summary: List one employee's advance balance and history, x-varya-permission: hr.employee_advance.read, responses: { "200": { description: Employee advance page } } }
  /api/v1/hr/employee-advances/{advanceID}/repayments:
    parameters: [{ name: advanceID, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: collectEmployeeAdvance
      summary: Atomically collect a partial or full repayment and cash/bank IN movement
      x-varya-permission: hr.employee_advance.collect
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeAdvanceRepaymentInput" } } } }
      responses: { "201": { description: Updated advance }, "409": { description: Repayment exceeds outstanding balance or advance is closed } }
  /api/v1/hr/employee-advances/{advanceID}/write-off:
    parameters: [{ name: advanceID, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: writeOffEmployeeAdvance
      summary: Write off the entire outstanding balance without a cash movement
      x-varya-permission: hr.employee_advance.writeoff
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeAdvanceReasonInput" } } } }
      responses: { "201": { description: Written-off advance } }
