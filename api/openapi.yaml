openapi: 3.0.3
info:
  title: Varya One API
  version: 0.2.0
  description: Public REST contract for Varya One identity, company-scoped Cari, product catalog, pricing and tax foundations.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Database and migration readiness
      responses:
        "200":
          description: The API is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency or migration is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      summary: Read the permanent first-run setup state
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
    post:
      operationId: completeSetup
      summary: Atomically create the first administrator, company, Merkez branch and Ana Depo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Setup completed and browser session created
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "409":
          {
            description: Setup is permanently closed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create a secure server-side browser session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          {
            description: Authenticated session,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SessionResponse" } },
              },
          }
        "401":
          {
            description: Invalid credentials,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
        "429":
          {
            description: Login rate limited,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current browser session
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Session revoked }
        "401":
          {
            description: Authentication required,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
        "403":
          {
            description: CSRF validation failed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/session:
    get:
      operationId: getSession
      summary: Read the current user, companies and effective permissions
      responses:
        "200":
          {
            description: Current session,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SessionResponse" } },
              },
          }
        "401":
          {
            description: Authentication required,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/session/csrf:
    get:
      operationId: refreshSessionCSRF
      summary: Rotate the CSRF secret for the current browser session
      description: Requires an authenticated same-origin browser session. This endpoint changes only the session CSRF secret and does not change business data.
      security: [{ browserSession: [] }]
      responses:
        "200":
          description: New CSRF secret; the matching browser cookie is also set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSRFRefreshResponse" }
        "401":
          {
            description: Authentication required,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
        "403":
          {
            description: Origin or browser-session validation failed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/session/company:
    put:
      operationId: selectCompany
      summary: Select a company already authorized by active membership
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [company_id]
              properties: { company_id: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Updated session context,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SessionResponse" } },
              },
          }
        "403":
          {
            description: Company access denied,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/preferences/tables/{tableKey}:
    parameters:
      - name: tableKey
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z][a-z0-9_.-]{0,127}$" }
    get:
      operationId: getTablePreference
      summary: Read the current user's table layout preference in the selected company
      security: [{ browserSession: [] }, { apiToken: [] }]
      responses:
        "200":
          {
            description: Table layout preference,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/TablePreference" } },
              },
          }
        "403":
          {
            description: Company context is not authorized,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
    put:
      operationId: saveTablePreference
      summary: Save the current user's table layout preference in the selected company
      security: [{ browserSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TablePreferenceRequest" }
      responses:
        "200":
          {
            description: Table layout preference saved,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/TablePreference" } },
              },
          }
        "422":
          {
            description: Invalid table or column preference,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/dashboard/recent-activity:
    get:
      operationId: listDashboardRecentActivity
      summary: Company-scoped recent business events for the home workspace
      security: [{ browserSession: [] }, { apiToken: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Recent activity feed, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/DashboardRecentEntry" }
        "403":
          description: Company context is not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/dashboard/shortcuts:
    get:
      operationId: getDashboardShortcuts
      summary: Read the current user's pinned home-screen shortcuts
      security: [{ browserSession: [] }, { apiToken: [] }]
      responses:
        "200":
          description: Pinned shortcut layout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardShortcuts" }
    put:
      operationId: saveDashboardShortcuts
      summary: Save the current user's pinned home-screen shortcuts
      security: [{ browserSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned_shortcuts:
                  type: array
                  items: { type: string, pattern: "^[a-z][a-z0-9_.:-]{0,63}$" }
      responses:
        "200":
          description: Pinned shortcut layout saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardShortcuts" }
        "422":
          description: Invalid shortcut key or too many shortcuts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/security/totp/setup:
    post:
      operationId: beginTOTPSetup
      summary: Create a pending encrypted TOTP secret
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: Secret displayed once for authenticator enrollment
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  { secret: { type: string }, otpauth_uri: { type: string } }
  /api/v1/security/totp/confirm:
    post:
      operationId: confirmTOTPSetup
      summary: Verify pending TOTP and issue one-time recovery codes
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties: { code: { type: string, pattern: "^[0-9]{6}$" } }
      responses:
        "200":
          description: TOTP enabled and recovery codes displayed once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  { recovery_codes: { type: array, items: { type: string } } }
  /api/v1/api-tokens:
    get:
      operationId: listAPITokens
      summary: List metadata for API tokens in the selected company
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          {
            description: Token metadata; plaintext is never returned,
            content: { application/json: { schema: { type: object } } },
          }
    post:
      operationId: createAPIToken
      summary: Create a company-scoped API token displayed once
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APITokenRequest" }
      responses:
        "201":
          {
            description: Token including one-time plaintext value,
            content: { application/json: { schema: { type: object } } },
          }
  /api/v1/api-tokens/{tokenID}:
    delete:
      operationId: revokeAPIToken
      summary: Revoke a token in the selected company
      parameters:
        - {
            name: tokenID,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Token revoked }
  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: List stable permission values
      responses:
        "200":
          {
            description: Permission codes,
            content: { application/json: { schema: { type: object } } },
          }
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: List roles in the selected company
      responses:
        "200":
          {
            description: Company roles,
            content: { application/json: { schema: { type: object } } },
          }
    post:
      operationId: createRole
      summary: Create an editable company role
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "201":
          {
            description: Role created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Role" } },
              },
          }
  /api/v1/roles/{roleID}:
    put:
      operationId: updateRole
      summary: Update a non-system role with optimistic locking
      parameters:
        - {
            name: roleID,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "200":
          {
            description: Role updated,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Role" } },
              },
          }
        "412":
          {
            description: Version conflict,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
        "428":
          {
            description: If-Match required,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List memberships in the selected company
      responses:
        "200":
          {
            description: Company users,
            content: { application/json: { schema: { type: object } } },
          }
    post:
      operationId: addUser
      summary: Create or attach a user and assign company-local roles/scopes
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserMembershipRequest" }
      responses:
        "201":
          {
            description: Membership saved,
            content: { application/json: { schema: { type: object } } },
          }
  /api/v1/company:
    get:
      operationId: getCurrentCompany
      summary: Read the selected company settings
      responses:
        "200":
          {
            description: Selected company,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CompanySummary" } },
              },
          }
    put:
      operationId: updateCurrentCompany
      summary: Update selected company settings with optimistic locking
      parameters:
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanySettingsRequest" }
      responses:
        "200":
          {
            description: Company updated,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CompanySummary" } },
              },
          }
        "412":
          {
            description: Version conflict,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/search:
    get:
      operationId: globalSearch
      summary: Search authorized Cari, Ürün/Stok Kartı and Belge records in the selected company
      security: [{ browserSession: [] }, { apiToken: [] }]
      parameters:
        - {
            name: q,
            in: query,
            description: At least two searchable characters; literal token search; empty and short values return no items,
            schema: { type: string, maxLength: 128 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 12 },
          }
      responses:
        "200":
          {
            description: Authorization-filtered search results,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/GlobalSearchResponse" },
                  },
              },
          }
        "400":
          {
            description: Invalid search query,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
        "401":
          {
            description: Authentication required,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/parties:
    get:
      operationId: listParties
      summary: List company-scoped current accounts with opaque cursor pagination
      security: [{ browserSession: [] }, { apiToken: [] }]
      parameters:
        - {
            name: q,
            in: query,
            description: Whitespace-separated literal tokens; every token must match a Party field or related company-scoped detail,
            schema: { type: string },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - {
            name: include_inactive,
            in: query,
            schema: { type: boolean, default: false },
          }
        - {
            name: role,
            in: query,
            description: Return only parties having the selected active role.,
            schema: { type: string, enum: [customer, supplier] },
          }
      responses:
        "200":
          {
            description: Current-account page,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PartyList" } },
              },
          }
    post:
      operationId: createParty
      summary: Create a person or organization current account
      security: [{ browserSession: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/PartyInput" } },
            },
        }
      responses:
        "201":
          {
            description: Current account created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Party" } },
              },
          }
        "422":
          {
            description: Domain validation failed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/parties/{partyID}:
    parameters: [{ $ref: "#/components/parameters/PartyID" }]
    get:
      operationId: getParty
      summary: Read a current-account card in the selected company
      security: [{ browserSession: [] }, { apiToken: [] }]
      responses:
        "200":
          {
            description: Current-account card,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Party" } },
              },
          }
    put:
      operationId: updateParty
      summary: Update current-account master data with optimistic locking; code and kind are immutable after creation
      security: [{ browserSession: [] }]
      parameters:
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/PartyInput" } },
            },
        }
      responses:
        "200":
          {
            description: Updated card,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Party" } },
              },
          }
        "412":
          {
            description: Version conflict,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
        "428":
          {
            description: If-Match required,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ErrorResponse" } },
              },
          }
  /api/v1/parties/{partyID}/deactivate:
    post:
      operationId: deactivateParty
      summary: Deactivate a card while retaining historical references
      security: [{ browserSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/PartyID" }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          {
            description: Deactivated card,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Party" } },
              },
          }
  /api/v1/parties/{partyID}/activate:
    post:
      operationId: activateParty
      summary: Activate a card while retaining historical references
      security: [{ browserSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/PartyID" }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          {
            description: Activated card,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Party" } },
              },
          }
  /api/v1/parties/{partyID}/balances:
    get:
      operationId: getPartyBalances
      summary: Derive balances from the immutable current-account ledger
      security: [{ browserSession: [] }, { apiToken: [] }]
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          {
            description: Per-currency balances,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PartyBalanceResponse" } },
              },
          }
  /api/v1/parties/{partyID}/statement:
    get:
      operationId: getPartyStatement
      summary: Read immutable current-account movements
      security: [{ browserSession: [] }, { apiToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/PartyID" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - {
            name: currency,
            in: query,
            description: "Keep figures in one transaction currency; omit to convert all rows to the company base currency.",
            schema: { type: string, pattern: "^[A-Z]{3}$" },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 1000 },
          }
      responses:
        "200":
          {
            description: Statement entries,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PartyStatementReport" } },
              },
          }
  /api/v1/address-references/provinces:
    get:
      operationId: listTurkishProvinces
      summary: List the embedded 81-province Turkish address catalog
      security: [{ browserSession: [] }, { apiToken: [] }]
      responses:
        "200":
          {
            description: Province references,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/AddressReferenceList" },
                  },
              },
          }
  /api/v1/address-references/provinces/{provinceID}/districts:
    get:
      operationId: listTurkishDistricts
      summary: List districts belonging to a Turkish province
      security: [{ browserSession: [] }, { apiToken: [] }]
      parameters:
        - {
            name: provinceID,
            in: path,
            required: true,
            schema: { type: integer, format: int64, minimum: 1, maximum: 81 },
          }
        - { name: q, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 2000, default: 1000 },
          }
      responses:
        "200":
          {
            description: District references,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/AddressReferenceList" },
                  },
              },
          }
  /api/v1/address-references/districts/{districtID}/neighborhoods:
    get:
      operationId: listTurkishNeighborhoods
      summary: List neighbourhoods belonging to a Turkish district
      security: [{ browserSession: [] }, { apiToken: [] }]
      parameters:
        - {
            name: districtID,
            in: path,
            required: true,
            schema: { type: integer, format: int64, minimum: 1 },
          }
        - { name: q, in: query, schema: { type: string } }
        - {
            name: limit,
