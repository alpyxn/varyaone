components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: varyaone_session
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: Varya One scoped token
  parameters:
    PartyID:
      name: partyID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A stable command key. Reuse with the same payload replays the original result; a different payload returns a conflict.
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The current document version returned in the ETag response header.
      schema: { type: string, pattern: "^\\\"?[0-9]+\\\"?$" }
    CommercialDocumentID:
      name: documentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommercialCommand:
      name: command
      in: path
      required: true
      schema: { type: string, enum: [send, accept, reject, confirm, post, finalize, cancel] }
    CommercialLifecycleFilter:
      name: lifecycle_status
      in: query
      description: Filter by the document lifecycle axis.
      schema: { type: string, enum: [DRAFT, OPEN, FINALIZED, CANCELLED, SENT, ACCEPTED, REJECTED, EXPIRED] }
    CommercialFulfillmentFilter:
      name: fulfillment_status
      in: query
      description: Filter by fulfillment progress.
      schema: { type: string, enum: [UNFULFILLED, PARTIALLY_FULFILLED, FULFILLED] }
    CommercialInvoicingFilter:
      name: invoicing_status
      in: query
      description: Filter by invoicing progress.
      schema: { type: string, enum: [UNINVOICED, PARTIALLY_INVOICED, INVOICED] }
    CommercialPaymentFilter:
      name: payment_status
      in: query
      description: Filter posted invoices by payment progress.
      schema: { type: string, enum: [UNPAID, PARTIALLY_PAID, PAID] }
    CommercialBranchFilter:
      name: branch_id
      in: query
      description: Restrict source/document lookup to one active branch in the selected company.
      schema: { type: string, format: uuid }
    CommercialCurrencyFilter:
      name: currency_code
      in: query
      description: Restrict source/document lookup to one document currency.
      schema: { type: string, pattern: "^[A-Z]{3}$" }
  schemas:
    GlobalSearchResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GlobalSearchItem" }
    GlobalSearchItem:
      type: object
      additionalProperties: false
      required: [type, title, detail, href]
      properties:
        type: { type: string, enum: [party, product, document] }
        title: { type: string }
        detail: { type: string }
        href: { type: string }
    SetupStatus:
      type: object
      additionalProperties: false
      required: [complete]
      properties: { complete: { type: boolean } }
    SetupRequest:
      type: object
      additionalProperties: false
      required:
        [admin_name, admin_email, password, legal_name, trade_name, entity_type]
      properties:
        admin_name: { type: string, minLength: 1, maxLength: 160 }
        admin_email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 1024 }
        legal_name: { type: string, minLength: 1, maxLength: 300 }
        trade_name: { type: string, minLength: 1, maxLength: 200 }
        entity_type: { type: string, enum: [LEGAL_ENTITY, SOLE_PROPRIETOR] }
        tax_number: { type: string, maxLength: 11 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        totp_code:
          {
            type: string,
            description: Six-digit TOTP or a one-time recovery code,
          }
    CompanySummary:
      type: object
      required:
        [
          id,
          legal_name,
          trade_name,
          entity_type,
          base_currency,
          timezone,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        legal_name: { type: string }
        trade_name: { type: string }
        entity_type: { type: string, enum: [LEGAL_ENTITY, SOLE_PROPRIETOR] }
        tax_number: { type: string }
        base_currency: { type: string }
        timezone: { type: string }
        duplicate_party_tax_number_policy:
          { type: string, enum: [ALLOW, WARN, BLOCK] }
        party_code_prefix: { type: string }
        party_code_digits: { type: integer, minimum: 3, maximum: 12 }
        version: { type: integer, format: int64 }
    SessionResponse:
      type: object
      required: [csrf_token, user, companies, expires_at, permissions]
      properties:
        csrf_token: { type: string }
        user:
          type: object
          required: [id, email, display_name, totp_enabled]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            display_name: { type: string }
            totp_enabled: { type: boolean }
        companies:
          {
            type: array,
            items: { $ref: "#/components/schemas/CompanySummary" },
          }
        current_company_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        permissions: { type: array, items: { type: string } }
    CSRFRefreshResponse:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token: { type: string, minLength: 32 }
    TablePreferenceRequest:
      type: object
      additionalProperties: false
      required: [column_visibility]
      properties:
        column_visibility:
          type: object
          maxProperties: 256
          additionalProperties: { type: boolean }
          description: Column IDs mapped to visibility; false entries are persisted as hidden columns.
    TablePreference:
      allOf:
        - { $ref: "#/components/schemas/TablePreferenceRequest" }
        - type: object
          required: [table_key, version]
          properties:
            table_key: { type: string }
            version: { type: integer, format: int64 }
            updated_at: { type: string, format: date-time }
    DashboardShortcuts:
      type: object
      required: [pinned_shortcuts]
      properties:
        pinned_shortcuts:
          type: array
          maxItems: 32
          items: { type: string, pattern: "^[a-z][a-z0-9_.:-]{0,63}$" }
          description: Stable shortcut keys, in display order. Empty when the user has no saved layout.
        version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    DashboardRecentEntry:
      type: object
      required: [kind, title_code, label, occurred_at, entry_id]
      properties:
        kind: { type: string, enum: [ledger, stock, document] }
        title_code: { type: string, description: Domain code (entry_type / movement_type / document_type_code). }
        label: { type: string }
        party_name: { type: string }
        amount: { type: string }
        currency: { type: string }
        direction: { type: string }
        occurred_at: { type: string, format: date-time }
        ref_type: { type: string }
        ref_id: { type: string }
        entry_id: { type: string }
    APITokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        scopes:
          type: array
          uniqueItems: true
          items:
            {
              type: string,
              enum:
                [
                  "organization:read",
                  "party:read",
                  "party:ledger:read",
                  "security:audit:read",
                  "security:users:read",
                ],
            }
        expires_at: { type: string, format: date-time }
    RoleRequest:
      type: object
      additionalProperties: false
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        permissions:
          {
            type: array,
            minItems: 1,
            uniqueItems: true,
            items: { type: string },
          }
    Role:
      type: object
      required: [id, name, is_system, version, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_system: { type: boolean }
        version: { type: integer, format: int64 }
        permissions: { type: array, items: { type: string } }
    UserMembershipRequest:
      type: object
      additionalProperties: false
      required: [email, role_ids]
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        password:
          {
            type: string,
            minLength: 12,
            description: Required only when creating a new global user,
          }
        role_ids:
          {
            type: array,
            minItems: 1,
            uniqueItems: true,
            items: { type: string, format: uuid },
          }
        branch_ids:
          {
            type: array,
            uniqueItems: true,
            items: { type: string, format: uuid },
          }
        warehouse_ids:
          {
            type: array,
            uniqueItems: true,
            items: { type: string, format: uuid },
          }
    CompanySettingsRequest:
      type: object
      additionalProperties: false
      required: [legal_name, trade_name, entity_type, base_currency, timezone]
      properties:
        legal_name: { type: string, minLength: 1 }
        trade_name: { type: string, minLength: 1 }
        entity_type: { type: string, enum: [LEGAL_ENTITY, SOLE_PROPRIETOR] }
        tax_number: { type: string, maxLength: 11 }
        base_currency: { type: string, minLength: 3, maxLength: 3 }
        timezone: { type: string }
        duplicate_party_tax_number_policy:
          {
            type: string,
            enum: [ALLOW, WARN, BLOCK],
            description: Omitted by Phase 0.1 clients to retain the current policy,
          }
        party_code_prefix: { type: string, minLength: 1, maxLength: 8 }
        party_code_digits: { type: integer, minimum: 3, maximum: 12 }
    PartyInput:
      type: object
      additionalProperties: false
      required: [kind, is_customer, is_supplier, display_name, default_currency]
      properties:
        code:
          {
            type: string,
            description: Empty on create requests an atomic company sequence number; immutable after creation,
          }
        kind:
          {
            type: string,
            enum: [PERSON, ORGANIZATION],
            description: Immutable after creation,
          }
        is_customer: { type: boolean }
        is_supplier: { type: boolean }
        display_name: { type: string, minLength: 1 }
        legal_name: { type: string }
        trade_name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        tax_number: { type: string, pattern: "^[0-9]{10}$" }
        identity_number: { type: string, pattern: "^[0-9]{11}$" }
        tax_office: { type: string }
        tax_office_id:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Optional selected row from the global GİB tax-office catalog,
          }
        default_currency: { type: string, pattern: "^[A-Z]{3}$" }
        payment_term_id: { type: string, format: uuid }
        price_list_id: { type: string, format: uuid }
        default_discount_rate: { $ref: "#/components/schemas/Decimal" }
        sales_rep_user_id: { type: string, format: uuid }
        credit_limit: { $ref: "#/components/schemas/Decimal" }
        risk_limit: { $ref: "#/components/schemas/Decimal" }
        risk_policy: { type: string, enum: [ALLOW, WARN, BLOCK] }
        addresses:
          {
            type: array,
            maxItems: 1,
            items: { $ref: "#/components/schemas/PartyAddress" },
          }
        contacts: { type: array, items: { type: object } }
        group_ids:
          {
            type: array,
            uniqueItems: true,
            items: { type: string, format: uuid },
          }
        tags: { type: array, uniqueItems: true, items: { type: string } }
        custom_fields:
          type: object
          additionalProperties: true
          description: Values keyed by stable custom-field code; NUMBER values are decimal strings.
    Party:
      allOf:
        - { $ref: "#/components/schemas/PartyInput" }
        - type: object
          required: [id, code, is_active, version]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            is_active: { type: boolean }
            version: { type: integer, format: int64 }
            phone:
              {
                type: string,
                readOnly: true,
                description: Primary contact phone for list presentation,
              }
            email:
              {
                type: string,
                readOnly: true,
                description: Primary contact e-mail for list presentation,
              }
            city:
              {
                type: string,
                readOnly: true,
                description: Default address city for list presentation,
              }
            address_summary:
              {
                type: string,
                readOnly: true,
                description: Default address summary for list presentation,
              }
            contact_summary:
              {
                type: string,
                readOnly: true,
                description: All contact channels in compact list form,
              }
            group_summary:
              {
                type: string,
                readOnly: true,
                description: Company-scoped cari group names,
              }
            tag_summary:
              {
                type: string,
                readOnly: true,
                description: Company-scoped tag names,
              }
            custom_field_summary:
              {
                type: string,
                readOnly: true,
                description: Custom-field names and values in compact list form,
              }
            payment_term_name:
              {
                type: string,
                readOnly: true,
                description: Payment-term display name,
